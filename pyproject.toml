[project]
name = "paytr-python"
version = "0.1.1"
description = "Async Python client for the PayTR payment APIs (iFrame, callback, refund, reporting)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Custom (MIT with Attribution Requirements)" }
keywords = ["paytr", "payment", "iframe", "fastapi", "async"]
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
httpx = [
    "httpx>=0.27",
]
# The FastAPI routes (paytr.fastapi) are optional. pydantic lives here, not in
# core deps: a client-only user never imports paytr.fastapi and shouldn't pay
# for it. `import paytr` (client + payment) needs only aiohttp.
fastapi = [
    "fastapi>=0.110",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://dev.paytr.com/en"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "uvicorn>=0.30",
    "fastapi>=0.110",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",  # demo only (main.py loads .env); not needed by the library
]

# Application project (src layout), not a published wheel — uv won't build/install it.
[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
# src/modules so the library imports as `paytr`; src for the app packages.
pythonpath = ["src/modules", "src"]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src/modules", "src"]
ignore-errors-in-generated-code = true
python-interpreter-path = ".venv/Scripts/python.exe"